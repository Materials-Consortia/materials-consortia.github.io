<div class="counter_body">
    <table class="counter_table" style="margin-left: auto; margin-right: auto">
        <tr>
            <td><span id="provider_counter" class="provider_counter counter">0</span></td>
            <td><span id="database_counter" class="database_counter counter">0</span></td>
            <td><span id="structure_counter" class="structure_counter counter">0</span></td>
        </tr>
        <tr>
            <th>PROVIDERS</th>
            <th>DATABASES</th>
            <th>STRUCTURES</th>
        </tr>
    </table>

    <p class="counter_source">
        Status as of Sep 2026, taken from the <a href="https://www.optimade.org/providers-dashboard/">OPTIMADE providers dashboard</a>.
    </p>

    <script>
        function createCounter(targetValue, totalTime, elementId) {
            let counter = 0;
            const counterElement = document.getElementById(elementId);

            // target 100 updates
            const chunk = Math.ceil(targetValue / 100);
            const interval = totalTime * 1000 / (targetValue / chunk);

            function incrementCounter() {
                // clamp, so the animation ends on the exact figure rather than
                // on the next multiple of chunk
                counter = Math.min(counter + chunk, targetValue);
                counterElement.textContent = counter.toLocaleString('en-US');


                if (counter < targetValue) {
                    setTimeout(incrementCounter, interval);
                }
            }

            incrementCounter();
        }

        // Create three counters.
        // These are the figures reported by https://www.optimade.org/providers-dashboard/
        // Please update the date in the caption above whenever you refresh them.
        createCounter(21, 1, 'provider_counter');
        createCounter(45, 1, 'database_counter');
        createCounter(27271308, 2, 'structure_counter');
    </script>
</div>
